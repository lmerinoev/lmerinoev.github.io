<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<title>Terradex</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Terradex">
<style>
  /* ---------------------------------------------------------
     SHOWCASE — photo-forward and airy. White ground, chunky
     geometric display type, full-bleed image cards with white
     overlays, rounded sheet detail pages, black pill actions,
     anchored black dock.
     --------------------------------------------------------- */
  :root {
    --bg: #FFFFFF;
    --ink: #141518;
    --mut: #9A9FA6;
    --soft: #F3F4F2;
    --line: #ECEDEA;
    --display: 'Futura', 'Century Gothic', 'Poppins', 'Trebuchet MS', -apple-system, sans-serif;
    --body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: auto; }
  body {
    font-family: var(--body);
    background: var(--bg);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.55;
    margin: 0;
    min-height: 100vh;
  }
  ::selection { background: var(--ink); color: #fff; }

  button {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    text-align: left;
  }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; border-radius: 10px; }
  a { color: inherit; }
  img { display: block; }
  .hidden { display: none !important; }

  .wrap {
    max-width: 430px;
    margin: 0 auto;
    padding: 0 0 calc(112px + env(safe-area-inset-bottom));
  }
  .pagepad { padding: calc(18px + env(safe-area-inset-top)) 20px 0; }

  /* ---------- floating dock, like the reference ---------- */
  #nav {
    position: fixed;
    bottom: calc(14px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    background: var(--ink);
    border-radius: 999px;
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.28);
  }
  #nav .in {
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 8px 12px;
  }
  #nav button {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #8D9096;
  }
  #nav button svg { width: 22px; height: 22px; display: block; }
  #nav button.on { background: #fff; color: var(--ink); }

  /* ---------- dex ---------- */
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .roundbtn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--soft);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
  }
  .roundbtn:active { background: var(--line); }
  .brandmark { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: 0.02em; }

  .h1 {
    font-family: var(--display);
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 0;
    line-height: 1.12;
    margin: 0 0 4px;
    max-width: 10ch;
  }
  .sub { font-family: var(--display); font-size: 13px; color: var(--mut); margin-bottom: 18px; }
  .sub b { color: var(--ink); font-weight: 700; }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button {
    font-family: var(--display);
    flex: none;
    font-size: 13px;
    font-weight: 600;
    color: var(--mut);
    background: var(--soft);
    border-radius: 999px;
    padding: 10px 18px;
  }
  .chips button.on { background: var(--ink); color: #fff; }

  .searchrow { margin: 0 0 14px; }
  .searchrow input {
    width: 100%;
    border: none;
    background: var(--soft);
    border-radius: 999px;
    font-family: var(--display);
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    padding: 13px 20px;
  }
  .searchrow input::placeholder { color: var(--mut); }

  .cards { display: flex; flex-direction: column; gap: 16px; }
  .placecard {
    position: relative;
    display: block;
    width: 100%;
    border-radius: 24px;
    overflow: hidden;
  }
  .placecard img { width: 100%; aspect-ratio: 4 / 4.4; object-fit: cover; }
  .placecard::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.38) 0%, rgba(0,0,0,0) 38%, rgba(0,0,0,0) 62%, rgba(0,0,0,0.30) 100%);
    pointer-events: none;
  }
  .placecard .nm {
    position: absolute;
    top: 16px;
    left: 18px;
    z-index: 1;
    color: #fff;
    font-family: var(--display);
    font-size: 24px;
    font-weight: 700;
    line-height: 1.15;
    max-width: 60%;
  }
  .placecard .no {
    position: absolute;
    top: 20px;
    right: 18px;
    z-index: 1;
    color: #fff;
    font-family: var(--display);
    font-size: 14px;
    font-weight: 600;
    opacity: 0.95;
  }
  .placecard .view {
    position: absolute;
    left: 16px;
    bottom: 14px;
    z-index: 1;
    background: #fff;
    color: var(--ink);
    font-family: var(--display);
    font-size: 13px;
    font-weight: 700;
    border-radius: 999px;
    padding: 11px 20px;
  }
  .placecard .stat {
    position: absolute;
    right: 16px;
    bottom: 14px;
    z-index: 1;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }
  .stat.s-visited { background: #fff; color: var(--ink); }
  .stat.s-upcoming { background: rgba(255,255,255,0.28); color: #fff; border: 1.5px solid rgba(255,255,255,0.9); }
  .stat.s-wishlist { background: rgba(255,255,255,0.28); color: #fff; border: 1.5px dashed rgba(255,255,255,0.9); }
  .placecard:active img { opacity: 0.85; }

  .unknowncard {
    border: 2px dashed var(--line);
    border-radius: 24px;
    padding: 26px;
    text-align: center;
    color: var(--mut);
    font-family: var(--display);
  }
  .unknowncard .q { font-size: 26px; font-weight: 700; }
  .unknowncard .t { font-size: 13px; font-weight: 600; margin-top: 2px; }
  .noresults { text-align: center; color: var(--mut); font-family: var(--display); font-weight: 600; padding: 30px 0; }

  /* ---------- entry ---------- */
  .hero {
    position: relative;
    height: 47vh;
    min-height: 320px;
  }
  .hero img { width: 100%; height: 100%; object-fit: cover; }
  .hero .fade {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.28) 0%, rgba(0,0,0,0) 30%);
    pointer-events: none;
  }
  .fbtn {
    position: absolute;
    top: calc(14px + env(safe-area-inset-top));
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.82);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: var(--ink);
    z-index: 2;
  }
  .fbtn.l { left: 16px; }
  .fbtn.r { right: 16px; font-size: 15px; }
  .fbtn:active { background: #fff; }

  .sheet {
    position: relative;
    background: var(--bg);
    border-radius: 28px 28px 0 0;
    margin-top: -30px;
    padding: 24px 20px 8px;
  }
  .collectfab {
    position: absolute;
    top: -27px;
    right: 22px;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 8px 24px rgba(0,0,0,0.16);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }
  .collectfab.done { background: var(--ink); color: #fff; }
  .sheet h1 {
    font-family: var(--display);
    font-size: 28px;
    font-weight: 700;
    line-height: 1.15;
    margin: 0 0 3px;
    max-width: 84%;
  }
  .sheet .rg { font-family: var(--display); font-size: 13px; font-weight: 600; color: var(--mut); }
  .sheet .credit { font-size: 10.5px; color: var(--mut); margin-top: 3px; }
  .sheet .flavor { font-size: 14px; color: #5B5F66; line-height: 1.65; margin: 12px 0 0; }

  .statchips { display: flex; gap: 10px; overflow-x: auto; margin: 16px -20px 0; padding: 0 20px 6px; scrollbar-width: none; }
  .statchips::-webkit-scrollbar { display: none; }
  .statchip {
    flex: none;
    background: var(--soft);
    border-radius: 16px;
    padding: 11px 15px 10px;
    min-width: 92px;
  }
  .statchip .v { font-family: var(--display); font-size: 14.5px; font-weight: 700; white-space: nowrap; }
  .statchip .k { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mut); margin-top: 1px; white-space: nowrap; }

  .tabchips { display: flex; gap: 8px; overflow-x: auto; margin: 18px 0 14px; scrollbar-width: none; }
  .tabchips::-webkit-scrollbar { display: none; }
  .tabchips button {
    font-family: var(--display);
    flex: none;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--mut);
    background: var(--soft);
    border-radius: 999px;
    padding: 9px 16px;
  }
  .tabchips button.on { background: var(--ink); color: #fff; }

  .facts { margin: 0; padding: 0; list-style: none; }
  .facts li { padding: 12px 0; display: flex; gap: 11px; font-size: 14px; line-height: 1.6; color: #3C4046; }
  .facts li + li { border-top: 1px solid var(--line); }
  .facts .bullet { flex: none; font-size: 10px; padding-top: 4px; color: var(--ink); }

  .tl-item { padding: 12px 0; }
  .tl-item + .tl-item { border-top: 1px solid var(--line); }
  .tl-item .era {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: var(--soft);
    color: var(--mut);
    border-radius: 999px;
    padding: 3px 10px;
  }
  .tl-item .t { font-family: var(--display); font-weight: 700; font-size: 15.5px; margin: 7px 0 2px; }
  .tl-item .x { font-size: 14px; line-height: 1.6; color: #3C4046; }

  .plateframe { border-radius: 18px; overflow: hidden; margin: 4px 0 6px; }
  .plateframe svg { display: block; width: 100%; height: auto; }
  .platecap { font-size: 10.5px; font-weight: 600; color: var(--mut); text-align: center; padding: 6px 0 10px; }

  .actionrow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin: 18px 0 10px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }
  .actionrow .price .v { font-family: var(--display); font-size: 19px; font-weight: 700; }
  .actionrow .price .k { font-size: 11px; color: var(--mut); font-weight: 600; }
  .bookbtn {
    background: var(--ink);
    color: #fff;
    font-family: var(--display);
    font-size: 15px;
    font-weight: 700;
    border-radius: 999px;
    padding: 16px 30px;
  }
  .bookbtn:active { opacity: 0.8; }
  .unmark { font-size: 11px; font-weight: 600; color: var(--mut); }

  /* ---------- map ---------- */
  .mapcard { background: var(--soft); border-radius: 22px; padding: 14px; margin-bottom: 14px; }
  .mapcard .mh { display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px 10px; font-family: var(--display); }
  .mapcard .mh .t { font-size: 15px; font-weight: 700; }
  .mapcard .mh .c { font-size: 12px; font-weight: 600; color: var(--mut); }
  .mapcard svg { display: block; width: 100%; height: auto; border-radius: 12px; background: #fff; }
  .legend { display: flex; justify-content: center; gap: 16px; padding: 10px 0 0; font-size: 10.5px; font-weight: 600; color: var(--mut); font-family: var(--display); }
  .legend span { display: flex; align-items: center; gap: 5px; }

  .pinrow {
    display: flex;
    align-items: center;
    gap: 13px;
    width: 100%;
    background: var(--soft);
    border-radius: 20px;
    padding: 10px 16px 10px 10px;
    margin-bottom: 10px;
  }
  .pinrow:active { background: var(--line); }
  .pinrow img { width: 54px; height: 54px; object-fit: cover; border-radius: 14px; flex: none; }
  .pinrow .mid { flex: 1; min-width: 0; }
  .pinrow .nm { font-family: var(--display); font-size: 16px; font-weight: 700; }
  .pinrow .rg { font-size: 11.5px; font-weight: 600; color: var(--mut); }
  .pinrow .st { font-size: 15px; flex: none; }

  /* ---------- info ---------- */
  .infocard { background: var(--soft); border-radius: 22px; padding: 18px 20px; margin-bottom: 14px; }
  .infocard h3 { margin: 0 0 6px; font-family: var(--display); font-size: 15px; font-weight: 700; }
  .prose { font-size: 14px; line-height: 1.65; color: #3C4046; }
  .prose p { margin: 8px 0 0; }
  .kv div { display: flex; justify-content: space-between; align-items: baseline; padding: 9px 0; border-bottom: 1px solid #E4E6E1; font-size: 13.5px; font-weight: 600; }
  .kv div:last-child { border-bottom: none; }
  .kv .k { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mut); }
</style>
</head>
<body>

<div class="wrap"><main id="view"></main></div>

<div id="nav">
  <div class="in">
    <button id="nav-dex" onclick="go('#/dex')" aria-label="Dex">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2.5 21.5 12 12 21.5 2.5 12Z"/></svg>
    </button>
    <button id="nav-map" onclick="go('#/map')" aria-label="Map">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6.5v13L9 17l6 2.5 6-2.5v-13L15 6.5 9 4Z"/><path d="M9 4v13M15 6.5v13"/></svg>
    </button>
    <button id="nav-info" onclick="go('#/info')" aria-label="Info">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6"/><circle cx="12" cy="7.6" r="0.6" fill="currentColor"/></svg>
    </button>
  </div>
</div>

<script src="data.js"></script>
<script src="map-data.js"></script>
<script>
/* ============================================================
   TERRADEX — a Pokédex for places. Showcase edition.
   ============================================================ */
const KEY = 'terradex-v1';
const store = {
  load() { try { return JSON.parse(localStorage.getItem(KEY)) || { collected: {} }; } catch { return { collected: {} }; } },
  save(s) { localStorage.setItem(KEY, JSON.stringify(s)); },
};

const pad3 = n => String(n).padStart(3, '0');
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

const STATUS_LABEL = { visited: 'Collected', upcoming: 'En route', wishlist: 'Uncharted' };
const STATUS_GLYPH = { visited: '◆', upcoming: '◈', wishlist: '◇' };

function effStatus(e) {
  const s = store.load();
  if (s.collected[e.id]) return 'visited';
  return e.status;
}
function collectedDate(e) {
  const s = store.load();
  return s.collected[e.id] || (e.status === 'visited' ? e.visitedDate || '' : '');
}
function counts() {
  const total = DEX.length;
  const got = DEX.filter(e => effStatus(e) === 'visited').length;
  return { got, total };
}

/* ---------- field plates (engraved SVG, shown in Deep time) ---------- */
const ART_DEFS = `<defs>
  <pattern id="hg" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="var(--mut)" stroke-width="1"/></pattern>
  <pattern id="hi" width="3.5" height="3.5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="3.5" stroke="var(--ink)" stroke-width="1"/></pattern>
  <pattern id="hx" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 0L6 6M6 0L0 6" stroke="var(--mut)" stroke-width="0.7" fill="none"/></pattern>
  <pattern id="dt" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1.4" cy="1.4" r="0.9" fill="var(--mut)"/><circle cx="4.4" cy="4.4" r="0.9" fill="var(--mut)"/></pattern>
  <pattern id="wl" width="9" height="5" patternUnits="userSpaceOnUse"><line x1="0" y1="1.5" x2="6" y2="1.5" stroke="var(--mut)" stroke-width="1"/></pattern>
  <pattern id="wg" width="9" height="5" patternUnits="userSpaceOnUse"><line x1="0" y1="1.5" x2="6" y2="1.5" stroke="#6E8F6E" stroke-width="1.1"/></pattern>
  <pattern id="wv" width="5" height="9" patternUnits="userSpaceOnUse"><line x1="1.5" y1="0" x2="1.5" y2="7" stroke="var(--mut)" stroke-width="1"/></pattern>
</defs>`;
function artSVG(art) {
  return `<svg viewBox="0 0 400 170" role="img"
    style="--gray:#A9ADA6; --red:#C8705C; --green:#6E8F6E; --paper:#F3F4F2; background:#F3F4F2">${ART_DEFS}${art}</svg>`;
}

/* ---------- views ---------- */
const FILTERS = [
  { key: 'all', label: 'All' },
  { key: 'visited', label: 'Collected' },
  { key: 'upcoming', label: 'En route' },
];

function viewDex() {
  const { got, total } = counts();
  const q = state.q.trim().toLowerCase();
  let list = DEX.filter(e => state.filter === 'all' || effStatus(e) === state.filter);
  if (q) {
    list = list.filter(e => e.name.toLowerCase().includes(q)
      || e.region.toLowerCase().includes(q)
      || pad3(e.num).includes(q)
      || e.types.join(' ').toLowerCase().includes(q));
  }

  const cards = list.map(e => {
    const st = effStatus(e);
    return `<button class="placecard" onclick="go('#/entry/${e.id}')">
      <img src="${e.photo.src}" alt="${esc(e.name)}" loading="lazy">
      <span class="nm">${esc(e.name)}</span>
      <span class="no">Nº ${pad3(e.num)}</span>
      <span class="view">View place</span>
      <span class="stat s-${st}">${STATUS_GLYPH[st]}</span>
    </button>`;
  }).join('');

  const unknown = (!q && state.filter === 'all')
    ? `<div class="unknowncard"><div class="q">?</div><div class="t">Nº ${pad3((DEX[DEX.length - 1]?.num || 0) + 1)} awaits — name a place</div></div>`
    : '';

  return `
    <div class="pagepad">
      <div class="topbar">
        <span class="brandmark">◆ Terradex</span>
        <button class="roundbtn" onclick="toggleSearch()" aria-label="Search">⌕</button>
      </div>
      <h1 class="h1">Find Your Next Place</h1>
      <div class="sub">A field guide to everywhere — <b>${got} of ${total}</b> collected</div>
      ${state.search ? `<div class="searchrow"><input id="q" type="search" placeholder="Name, number, or type"
        value="${esc(state.q)}" oninput="setQuery(this.value)" autocomplete="off"></div>` : ''}
      <div class="chips">${FILTERS.map(f =>
        `<button class="${state.filter === f.key ? 'on' : ''}" onclick="setFilter('${f.key}')">${f.label}</button>`).join('')}
      </div>
      <div class="cards">${cards || `<div class="noresults">Nothing matches yet.</div>`}${unknown}</div>
    </div>`;
}

function viewEntry(id) {
  const e = DEX.find(x => x.id === id);
  if (!e) return `<div class="pagepad prose">Entry not found.</div>`;
  const st = effStatus(e);
  const date = collectedDate(e);
  const tab = state.tab;

  let body = '';
  if (tab === 'facts') {
    body = `<ul class="facts">${e.facts.map(f => `<li><span class="bullet">◆</span><span>${esc(f)}</span></li>`).join('')}</ul>`;
  } else {
    const deep = tab === 'deep';
    const items = deep ? e.deepTime : e.history;
    const plate = deep
      ? `<div class="plateframe">${artSVG(e.art)}</div>
         <div class="platecap">Field plate Nº ${pad3(e.num)} — the deep-time scene, engraved</div>`
      : '';
    body = plate + items.map(i =>
      `<div class="tl-item"><span class="era">${esc(i.era)}</span><div class="t">${esc(i.title)}</div><div class="x">${esc(i.text)}</div></div>`).join('');
  }

  const userCollected = !!store.load().collected[e.id];
  const action = st === 'visited'
    ? `<div class="price"><div class="v">◆ Collected</div><div class="k">${date ? esc(date) : 'in the bag'}${userCollected ? ` · <button class="unmark" onclick="unmark('${e.id}')">unmark</button>` : ''}</div></div>
       <button class="bookbtn" onclick="go('#/map')">See map</button>`
    : `<div class="price"><div class="v">${STATUS_GLYPH[st]} ${STATUS_LABEL[st]}</div><div class="k">${st === 'upcoming' ? 'trip coming up' : 'someday'}</div></div>
       <button class="bookbtn" onclick="mark('${e.id}')">◆ Collect</button>`;

  return `
    <div class="hero">
      <img src="${e.photo.src}" alt="${esc(e.name)}">
      <div class="fade"></div>
      <button class="fbtn l" onclick="go('#/dex')" aria-label="Back">←</button>
      <span class="fbtn r" title="${STATUS_LABEL[st]}">${STATUS_GLYPH[st]}</span>
    </div>
    <div class="sheet">
      <button class="collectfab ${st === 'visited' ? 'done' : ''}" aria-label="Collect"
        onclick="${st === 'visited' ? `go('#/map')` : `mark('${e.id}')`}">◆</button>
      <h1>${esc(e.name)}</h1>
      <div class="rg">Nº ${pad3(e.num)} · ${esc(e.region)}</div>
      <div class="credit">photo: ${esc(e.photo.credit)} / Unsplash</div>
      <p class="flavor">${esc(e.flavor)}</p>
      <div class="statchips">${Object.entries(e.stats).map(([k, v]) =>
        `<div class="statchip"><div class="v">${esc(v)}</div><div class="k">${esc(k)}</div></div>`).join('')}
      </div>
      <div class="tabchips">
        <button class="${tab === 'facts' ? 'on' : ''}" onclick="setTab('facts')">Facts</button>
        <button class="${tab === 'history' ? 'on' : ''}" onclick="setTab('history')">History</button>
        <button class="${tab === 'deep' ? 'on' : ''}" onclick="setTab('deep')">Deep time</button>
      </div>
      ${body}
      <div class="actionrow">${action}</div>
    </div>`;
}

function mapSVG(G, size) {
  let dots = '';
  for (let r = 0; r < G.rows; r++) {
    const row = G.land[r];
    for (let c = 0; c < G.cols; c++) {
      if (row[c] === '#') dots += `<rect x="${c + 0.18}" y="${r + 0.18}" width="0.64" height="0.64" fill="#C9CCC6"/>`;
    }
  }
  const inBounds = e => e.coords.lon >= G.lonMin && e.coords.lon <= G.lonMax
    && e.coords.lat >= G.latMin && e.coords.lat <= G.latMax;
  const toXY = (lat, lon) => [
    (lon - G.lonMin) / (G.lonMax - G.lonMin) * G.cols,
    (G.latMax - lat) / (G.latMax - G.latMin) * G.rows,
  ];
  let marks = '';
  for (const e of DEX.filter(inBounds)) {
    const st = effStatus(e);
    const [x, y] = toXY(e.coords.lat, e.coords.lon);
    const d = `M ${x} ${y - size} L ${x + size} ${y} L ${x} ${y + size} L ${x - size} ${y} Z`;
    const color = st === 'wishlist' ? '#9A9FA6' : '#141518';
    const fill = st === 'visited' ? '#141518' : '#FFFFFF';
    marks += `<g onclick="go('#/entry/${e.id}')" style="cursor:pointer">
      <rect x="${x - 3}" y="${y - 3}" width="6" height="6" fill="transparent"/>
      <path d="${d}" fill="${fill}" stroke="${color}" stroke-width="0.6"/>
    </g>`;
  }
  return `<svg viewBox="0 0 ${G.cols} ${G.rows}" shape-rendering="crispEdges">${dots}${marks}</svg>`;
}

function viewMap() {
  const { got, total } = counts();
  const pins = DEX.map(e => {
    const st = effStatus(e);
    return `<button class="pinrow" onclick="go('#/entry/${e.id}')">
      <img src="${e.photo.src}" alt="" loading="lazy">
      <span class="mid">
        <div class="nm">${esc(e.name)}</div>
        <div class="rg">${esc(e.region)}</div>
      </span>
      <span class="st">${STATUS_GLYPH[st]}</span>
    </button>`;
  }).join('');
  const usPins = typeof MAP_GRID_US !== 'undefined'
    && DEX.some(e => e.coords.lon >= MAP_GRID_US.lonMin && e.coords.lon <= MAP_GRID_US.lonMax
      && e.coords.lat >= MAP_GRID_US.latMin && e.coords.lat <= MAP_GRID_US.latMax);
  return `
    <div class="pagepad">
      <h1 class="h1">Your Map So Far</h1>
      <div class="sub"><b>${got} of ${total}</b> diamonds filled in</div>
      <div class="mapcard">
        <div class="mh"><span class="t">World</span><span class="c">${got}/${total}</span></div>
        ${mapSVG(MAP_GRID, 1.7)}
        <div class="legend">
          <span>◆ Collected</span><span>◇ En route</span>
        </div>
      </div>
      ${usPins ? `<div class="mapcard">
        <div class="mh"><span class="t">USA</span></div>
        ${mapSVG(MAP_GRID_US, 1.5)}
      </div>` : ''}
      ${pins}
    </div>`;
}

function viewInfo() {
  return `
    <div class="pagepad">
      <h1 class="h1">About This Guide</h1>
      <div class="sub">A Pokédex for places</div>
      <div class="infocard">
        <h3>How it works</h3>
        <div class="prose">
          <p style="margin-top:0">Every entry logs the facts, the human history, and the deep time underneath: what stood on that ground when dinosaurs walked, and long before.</p>
          <p>New entries are forged in code. Bring a destination to Claude, and a researched page — photo, facts, deep time and all — ships to the dex as a commit.</p>
          <p>Tap <b>◆ Collect</b> when you have stood on a place's ground. Collections live on this device.</p>
        </div>
      </div>
      <div class="infocard">
        <h3>Spec</h3>
        <div class="kv">
          <div><span class="k">Firmware</span><span>v10 · Showcase</span></div>
          <div><span class="k">Photos</span><span>Unsplash, bundled offline</span></div>
          <div><span class="k">Storage</span><span>On-device</span></div>
          <div><span class="k">Network</span><span>Works offline</span></div>
        </div>
      </div>
      <div class="infocard">
        <h3>Install</h3>
        <div class="prose">
          <p style="margin:0">On iPhone: open in Safari → Share → <b>Add to Home Screen</b>. Runs full-screen and offline.</p>
        </div>
      </div>
    </div>`;
}

/* ---------- router ---------- */
const state = { tab: 'facts', q: '', filter: 'all', search: false };

function route() {
  const h = location.hash || '#/dex';
  if (h.startsWith('#/entry/')) return { view: 'entry', id: h.slice(8) };
  if (h === '#/map') return { view: 'map' };
  if (h === '#/info') return { view: 'info' };
  return { view: 'dex' };
}

function render() {
  const r = route();
  const el = document.getElementById('view');
  if (r.view === 'entry') el.innerHTML = viewEntry(r.id);
  else if (r.view === 'map') el.innerHTML = viewMap();
  else if (r.view === 'info') el.innerHTML = viewInfo();
  else el.innerHTML = viewDex();

  for (const n of ['dex', 'map', 'info']) {
    document.getElementById('nav-' + n).classList.toggle('on', r.view === n || (n === 'dex' && r.view === 'entry'));
  }
}

function go(hash) {
  if (location.hash === hash) {
    render();
    window.scrollTo(0, 0);
    return;
  }
  state.tab = 'facts';
  location.hash = hash;
}
function setTab(t) { state.tab = t; render(); }
function setFilter(f) { state.filter = f; render(); }
function toggleSearch() {
  state.search = !state.search;
  if (!state.search) state.q = '';
  render();
  if (state.search) document.getElementById('q')?.focus();
}
function setQuery(v) {
  state.q = v;
  const cards = document.querySelector('.cards');
  if (!cards) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = viewDex();
  cards.replaceWith(tmp.querySelector('.cards'));
}

function mark(id) {
  const s = store.load();
  s.collected[id] = new Date().toISOString().slice(0, 10);
  store.save(s);
  render();
}
function unmark(id) {
  const s = store.load();
  delete s.collected[id];
  store.save(s);
  render();
}

window.addEventListener('hashchange', () => {
  render();
  window.scrollTo(0, 0);
});
render();

/* ---------- PWA ---------- */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
