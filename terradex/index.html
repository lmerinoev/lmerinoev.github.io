<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F0F0ED">
<title>Terradex</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Terradex">
<style>
  /* ---------------------------------------------------------
     PLAYFUL E-INK — cool off-white ground, white cards, ink,
     one gray, red + green accents. Overlapping circles, pills,
     chunky friendly type. No gradients, no eased motion.
     --------------------------------------------------------- */
  :root {
    --ground: #F0F0ED;
    --card: #FCFCFA;
    --ink: #17181A;
    --gray: #92938C;
    --faint: #E2E2DC;
    --track: #E7E7E2;
    --red: #D64533;
    --green: #4F8748;
    --paper: #FCFCFA; /* plates & maps paint "paper" = card white */
    --sans: -apple-system, BlinkMacSystemFont, 'SF Pro Rounded', 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; transition: none !important; animation: none; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: auto; }
  body {
    font-family: var(--sans);
    background: var(--ground);
    background-image: radial-gradient(rgba(23, 24, 26, 0.035) 1px, transparent 1px);
    background-size: 3px 3px;
    color: var(--ink);
    font-size: 15px;
    line-height: 1.55;
    letter-spacing: -0.005em;
    margin: 0;
    min-height: 100vh;
  }
  ::selection { background: var(--ink); color: var(--card); }

  button {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    text-align: left;
  }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; border-radius: 6px; }
  a { color: inherit; }
  .hidden { display: none !important; }
  .mono { font-family: var(--mono); }

  .h-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gray);
  }

  .card {
    background: var(--card);
    border-radius: 24px;
    position: relative;
    overflow: hidden;
  }

  /* ---------- chrome ---------- */
  #topbar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--ground);
    padding: calc(12px + env(safe-area-inset-top)) 20px 10px;
  }
  #topbar .in {
    max-width: 420px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  #topbar .mark { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
  #topbar .mark .dia { color: var(--red); font-size: 14px; }
  #topbar .tally { font-size: 12px; font-weight: 600; color: var(--gray); }
  #topbar .tally b { color: var(--ink); }

  #nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 5;
    background: var(--ground);
    border-top: 1px solid var(--faint);
    padding: 10px 20px calc(10px + env(safe-area-inset-bottom));
  }
  #nav .in {
    max-width: 420px;
    margin: 0 auto;
    display: flex;
    justify-content: center;
    gap: 10px;
  }
  #nav button {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--gray);
    padding: 9px 22px;
    border-radius: 999px;
  }
  #nav button.on { background: var(--ink); color: var(--card); }

  .wrap {
    max-width: 420px;
    margin: 0 auto;
    padding: 0 14px calc(88px + env(safe-area-inset-bottom));
  }
  main { padding-top: 8px; display: flex; flex-direction: column; gap: 10px; }

  /* ---------- dex ---------- */
  .hero { padding: 24px 24px 20px; }
  .hero-art { position: absolute; top: 0; right: 0; width: 190px; height: auto; }
  .hero .h-label { position: relative; }
  .hero .n {
    position: relative;
    font-size: 56px;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.04em;
    margin: 2px 0 8px;
  }
  .hero .n .of { font-size: 22px; font-weight: 700; color: var(--gray); letter-spacing: -0.01em; }
  .hero .dots { position: relative; font-size: 15px; letter-spacing: 0.3em; }
  .dots .d-visited { color: var(--red); }
  .dots .d-upcoming { color: var(--green); }
  .dots .d-wishlist, .dots .d-unknown { color: var(--gray); }

  .row {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 16px 18px;
  }
  .row:active { background: var(--faint); }
  .rnum { font-family: var(--mono); font-size: 11px; color: var(--gray); letter-spacing: 0.06em; flex: none; width: 28px; }
  .rmain { flex: 1; min-width: 0; }
  .rname { display: block; font-size: 20px; font-weight: 750; letter-spacing: -0.02em; line-height: 1.25; }
  .rsub {
    display: block;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gray);
    margin-top: 2px;
  }

  .chip {
    flex: none;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
  }
  .chip-visited { background: var(--red); color: var(--card); }
  .chip-upcoming { background: var(--card); color: var(--green); border: 2px solid var(--green); }
  .chip-wishlist { background: var(--card); color: var(--gray); border: 2px dashed var(--gray); }

  .row.unknown { background: none; border: 2px dashed var(--faint); border-radius: 24px; }
  .row.unknown .rname { color: var(--gray); font-weight: 600; }
  .row.unknown:active { background: none; }

  .g-visited { color: var(--red); }
  .g-upcoming { color: var(--green); }
  .g-wishlist { color: var(--gray); }

  /* ---------- entry ---------- */
  .crumb {
    font-size: 13px;
    font-weight: 700;
    color: var(--gray);
    padding: 6px 6px 10px;
  }
  .crumb:active { color: var(--ink); }

  .ehead { padding: 26px 24px 22px; }
  .ecorner {
    position: absolute;
    top: -44px;
    right: -44px;
    width: 130px;
    height: 130px;
    border-radius: 50%;
  }
  .ecorner.c-visited { background: var(--red); }
  .ecorner.c-upcoming { background: var(--green); }
  .ecorner.c-wishlist { background: var(--faint); }
  .edrip { position: absolute; top: 40px; right: 34px; width: 3px; height: 26px; }
  .edrip.c-visited { background: var(--red); }
  .edrip.c-upcoming { background: var(--green); }
  .edrip.c-wishlist { background: var(--faint); }
  .enum { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; color: var(--gray); }
  .ehead h1 {
    margin: 4px 0 4px;
    font-size: 36px;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.05;
    max-width: 82%;
  }
  .eregion {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gray);
  }
  .spill {
    display: inline-block;
    margin-top: 14px;
    font-size: 11.5px;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-radius: 999px;
    padding: 7px 14px;
  }
  .s-visited { background: var(--red); color: var(--card); }
  .s-upcoming { background: var(--green); color: var(--card); }
  .s-wishlist { background: var(--track); color: var(--gray); }

  .plate { padding: 10px 10px 12px; }
  .plate svg { display: block; width: 100%; height: auto; border-radius: 16px; }
  .plate .caption {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.12em;
    color: var(--gray);
    text-transform: uppercase;
    padding: 8px 10px 0;
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }

  .flavor {
    margin: 14px 20px 4px;
    font-size: 16px;
    font-weight: 500;
    font-style: italic;
    line-height: 1.6;
    text-align: center;
  }
  .flavor::before {
    content: '◆';
    display: block;
    font-style: normal;
    font-size: 10px;
    color: var(--red);
    margin-bottom: 8px;
  }

  .statcard { padding: 8px 22px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; column-gap: 22px; }
  .stats > div { padding: 12px 0 11px; border-top: 1px solid var(--faint); }
  .stats > div:nth-child(-n+2) { border-top: none; }
  .stats .k {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gray);
  }
  .stats .v { font-size: 19px; font-weight: 750; letter-spacing: -0.02em; margin-top: 1px; }

  .tabs {
    display: flex;
    background: var(--track);
    border-radius: 999px;
    padding: 4px;
    margin: 8px 0 0;
  }
  .tabs button {
    flex: 1;
    text-align: center;
    font-size: 12.5px;
    font-weight: 750;
    letter-spacing: 0.02em;
    color: var(--gray);
    padding: 9px 0;
    border-radius: 999px;
  }
  .tabs button.on { background: var(--ink); color: var(--card); }

  .tabcard { padding: 6px 20px; }
  .facts { margin: 0; padding: 0; list-style: none; }
  .facts li { padding: 14px 0; display: flex; gap: 12px; font-size: 14.5px; line-height: 1.6; }
  .facts li + li { border-top: 1px solid var(--faint); }
  .facts .bullet { color: var(--red); flex: none; font-size: 10px; padding-top: 4px; }

  .tl-item { padding: 14px 0; }
  .tl-item + .tl-item { border-top: 1px solid var(--faint); }
  .tl-item .era {
    display: inline-block;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--card);
    background: var(--ink);
    border-radius: 999px;
    padding: 3px 10px;
  }
  .tl-item.deep .era { background: var(--green); }
  .tl-item .t { font-weight: 750; font-size: 16px; letter-spacing: -0.015em; margin: 7px 0 3px; }
  .tl-item .x { font-size: 14.5px; line-height: 1.6; }

  .collectwrap { margin-top: 10px; }
  .collectbtn {
    display: block;
    width: 100%;
    text-align: center;
    background: var(--red);
    color: var(--card);
    border-radius: 999px;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 17px 0;
  }
  .collectbtn:active { opacity: 0.75; }
  .collected-card {
    text-align: center;
    padding: 20px;
  }
  .collected-line {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--red);
  }
  .unmark {
    display: block;
    margin: 10px auto 0;
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gray);
  }

  /* ---------- map ---------- */
  .mapcard { padding: 10px; }
  .maphead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 10px 12px 8px;
  }
  .maphead .cnt { font-size: 12px; font-weight: 700; color: var(--gray); }
  .mapcard svg { display: block; width: 100%; height: auto; border-radius: 16px; background: var(--card); }
  .legend {
    display: flex;
    justify-content: center;
    gap: 18px;
    padding: 12px 0 6px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gray);
  }
  .legend span { display: flex; align-items: center; gap: 6px; }

  /* ---------- info ---------- */
  .infocard { padding: 20px 22px; }
  .prose { font-size: 14.5px; line-height: 1.7; }
  .prose p { margin: 10px 0 0; }
  .kv { margin-top: 4px; }
  .kv div {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 11px 0;
    border-bottom: 1px solid var(--faint);
    font-size: 14px;
    font-weight: 600;
  }
  .kv div:last-child { border-bottom: none; }
  .kv .k {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gray);
  }

  /* ---------- e-ink refresh flash ---------- */
  #flash {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: var(--ink);
    pointer-events: none;
    display: none;
  }
  #flash.on { display: block; }
</style>
</head>
<body>

<div id="topbar">
  <div class="in">
    <span class="mark"><span class="dia">◆</span> Terradex</span>
    <span class="tally" id="tally"></span>
  </div>
</div>

<div class="wrap"><main id="view"></main></div>

<div id="nav">
  <div class="in">
    <button id="nav-dex" onclick="go('#/dex')">Dex</button>
    <button id="nav-map" onclick="go('#/map')">Map</button>
    <button id="nav-info" onclick="go('#/info')">Info</button>
  </div>
</div>

<div id="flash"></div>

<script src="data.js"></script>
<script src="map-data.js"></script>
<script>
/* ============================================================
   TERRADEX — a Pokédex for places, in e-ink.
   ============================================================ */
const KEY = 'terradex-v1';
const store = {
  load() { try { return JSON.parse(localStorage.getItem(KEY)) || { collected: {} }; } catch { return { collected: {} }; } },
  save(s) { localStorage.setItem(KEY, JSON.stringify(s)); },
};

const pad3 = n => String(n).padStart(3, '0');
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

const STATUS_LABEL = { visited: 'Collected', upcoming: 'En route', wishlist: 'Uncharted' };
const STATUS_GLYPH = { visited: '◆', upcoming: '◈', wishlist: '◇' };

function effStatus(e) {
  const s = store.load();
  if (s.collected[e.id]) return 'visited';
  return e.status;
}
function collectedDate(e) {
  const s = store.load();
  return s.collected[e.id] || (e.status === 'visited' ? e.visitedDate || '' : '');
}
function counts() {
  const total = DEX.length;
  const got = DEX.filter(e => effStatus(e) === 'visited').length;
  return { got, total };
}

/* ---------- field plates (engraved-style SVG illustrations) ---------- */
const ART_DEFS = `<defs>
  <pattern id="hg" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="var(--gray)" stroke-width="1"/></pattern>
  <pattern id="hi" width="3.5" height="3.5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="3.5" stroke="var(--ink)" stroke-width="1"/></pattern>
  <pattern id="hx" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 0L6 6M6 0L0 6" stroke="var(--gray)" stroke-width="0.7" fill="none"/></pattern>
  <pattern id="dt" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1.4" cy="1.4" r="0.9" fill="var(--gray)"/><circle cx="4.4" cy="4.4" r="0.9" fill="var(--gray)"/></pattern>
  <pattern id="wl" width="9" height="5" patternUnits="userSpaceOnUse"><line x1="0" y1="1.5" x2="6" y2="1.5" stroke="var(--gray)" stroke-width="1"/></pattern>
  <pattern id="wg" width="9" height="5" patternUnits="userSpaceOnUse"><line x1="0" y1="1.5" x2="6" y2="1.5" stroke="var(--green)" stroke-width="1.1"/></pattern>
  <pattern id="wv" width="5" height="9" patternUnits="userSpaceOnUse"><line x1="1.5" y1="0" x2="1.5" y2="7" stroke="var(--gray)" stroke-width="1"/></pattern>
</defs>`;
function artSVG(art) {
  return `<svg viewBox="0 0 400 170" role="img">${ART_DEFS}${art}</svg>`;
}

/* hero card art: overlapping circles with drips, a nod to e-ink poster art */
const HERO_ART = `<svg class="hero-art" viewBox="0 0 190 120" aria-hidden="true">
  <circle cx="132" cy="18" r="34" fill="var(--red)"/>
  <path d="M120 44 L120 78 M132 50 L132 64 M144 46 L144 96" stroke="var(--red)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="86" cy="34" r="22" fill="none" stroke="var(--ink)" stroke-width="2.5"/>
  <path d="M86 56 L86 74" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="168" cy="62" r="13" fill="var(--green)"/>
  <path d="M168 75 L168 92" stroke="var(--green)" stroke-width="3" stroke-linecap="round"/>
</svg>`;

/* ---------- views ---------- */
function viewDex() {
  const { got, total } = counts();
  const unknownSlots = typeof DEX_UNKNOWN_SLOTS === 'number' ? DEX_UNKNOWN_SLOTS : 0;
  const dots = DEX.map(e => `<span class="d-${effStatus(e)}">${STATUS_GLYPH[effStatus(e)]}</span>`).join('')
    + `<span class="d-unknown">${'·'.repeat(unknownSlots)}</span>`;

  const rows = DEX.map(e => {
    const st = effStatus(e);
    return `<button class="card row" onclick="go('#/entry/${e.id}')">
      <span class="rnum">${pad3(e.num)}</span>
      <span class="rmain">
        <span class="rname">${esc(e.name)}</span>
        <span class="rsub">${esc(e.region)}</span>
      </span>
      <span class="chip chip-${st}" title="${STATUS_LABEL[st]}">${STATUS_GLYPH[st]}</span>
    </button>`;
  }).join('');

  let unknown = '';
  const nextNum = (DEX[DEX.length - 1]?.num || 0) + 1;
  for (let i = 0; i < unknownSlots; i++) {
    unknown += `<div class="row unknown">
      <span class="rnum">${pad3(nextNum + i)}</span>
      <span class="rmain"><span class="rname">Somewhere new?</span><span class="rsub">Not yet logged</span></span>
      <span class="chip chip-wishlist">?</span>
    </div>`;
  }

  return `
    <div class="card hero">
      ${HERO_ART}
      <div class="h-label">Collected</div>
      <div class="n">${got}<span class="of"> of ${total}</span></div>
      <div class="dots">${dots}</div>
    </div>
    ${rows}${unknown}`;
}

function viewEntry(id) {
  const e = DEX.find(x => x.id === id);
  if (!e) return `<div class="card infocard prose">Entry not found.</div>`;
  const st = effStatus(e);
  const date = collectedDate(e);
  const tab = state.tab;

  const statsHTML = Object.entries(e.stats).map(([k, v]) =>
    `<div><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('');

  let body = '';
  if (tab === 'facts') {
    body = `<ul class="facts">${e.facts.map(f => `<li><span class="bullet">◆</span><span>${esc(f)}</span></li>`).join('')}</ul>`;
  } else {
    const items = tab === 'history' ? e.history : e.deepTime;
    const cls = tab === 'deep' ? 'tl-item deep' : 'tl-item';
    body = items.map(i =>
      `<div class="${cls}"><span class="era">${esc(i.era)}</span><div class="t">${esc(i.title)}</div><div class="x">${esc(i.text)}</div></div>`).join('');
  }

  const lat = e.coords.lat, lon = e.coords.lon;
  const coordStr = `${Math.abs(lat).toFixed(2)}°${lat >= 0 ? 'N' : 'S'} ${Math.abs(lon).toFixed(2)}°${lon >= 0 ? 'E' : 'W'}`;

  const userCollected = !!store.load().collected[e.id];
  const collectUI = st === 'visited'
    ? `<div class="card collected-card">
         <div class="collected-line">◆ Collected${date ? ' · ' + esc(date) : ''}</div>
         ${userCollected ? `<button class="unmark" onclick="unmark('${e.id}')">Unmark</button>` : ''}
       </div>`
    : `<button class="collectbtn" onclick="mark('${e.id}')">◆ Mark collected</button>`;

  return `
    <button class="crumb" onclick="go('#/dex')">← Back to dex</button>
    <div class="card ehead">
      <div class="ecorner c-${st}"></div>
      <div class="edrip c-${st}"></div>
      <div class="enum">Nº ${pad3(e.num)}</div>
      <h1>${esc(e.name)}</h1>
      <div class="eregion">${esc(e.region)} · ${e.types.map(esc).join(' / ')}</div>
      <span class="spill s-${st}">${STATUS_GLYPH[st]} ${STATUS_LABEL[st]}</span>
    </div>
    <figure class="card plate" style="margin:0">
      ${artSVG(e.art)}
      <div class="caption"><span>Field plate Nº ${pad3(e.num)}</span><span>${coordStr}</span></div>
    </figure>
    <p class="flavor">${esc(e.flavor)}</p>
    <section class="card statcard"><div class="stats">${statsHTML}</div></section>
    <nav class="tabs">
      <button class="${tab === 'facts' ? 'on' : ''}" onclick="setTab('facts')">Facts</button>
      <button class="${tab === 'history' ? 'on' : ''}" onclick="setTab('history')">History</button>
      <button class="${tab === 'deep' ? 'on' : ''}" onclick="setTab('deep')">Deep time</button>
    </nav>
    <div class="card tabcard">${body}</div>
    <div class="collectwrap">${collectUI}</div>`;
}

function mapSVG(G, size) {
  let dots = '';
  for (let r = 0; r < G.rows; r++) {
    const row = G.land[r];
    for (let c = 0; c < G.cols; c++) {
      if (row[c] === '#') dots += `<rect x="${c + 0.18}" y="${r + 0.18}" width="0.64" height="0.64" fill="var(--gray)"/>`;
    }
  }
  const inBounds = e => e.coords.lon >= G.lonMin && e.coords.lon <= G.lonMax
    && e.coords.lat >= G.latMin && e.coords.lat <= G.latMax;
  const toXY = (lat, lon) => [
    (lon - G.lonMin) / (G.lonMax - G.lonMin) * G.cols,
    (G.latMax - lat) / (G.latMax - G.latMin) * G.rows,
  ];
  let marks = '';
  for (const e of DEX.filter(inBounds)) {
    const st = effStatus(e);
    const [x, y] = toXY(e.coords.lat, e.coords.lon);
    const d = `M ${x} ${y - size} L ${x + size} ${y} L ${x} ${y + size} L ${x - size} ${y} Z`;
    const color = st === 'wishlist' ? 'var(--ink)' : st === 'upcoming' ? 'var(--green)' : 'var(--red)';
    const fill = st === 'visited' ? color : 'var(--card)';
    marks += `<g onclick="go('#/entry/${e.id}')" style="cursor:pointer">
      <rect x="${x - 3}" y="${y - 3}" width="6" height="6" fill="transparent"/>
      <path d="${d}" fill="${fill}" stroke="${color}" stroke-width="0.55"/>
    </g>`;
  }
  return `<svg viewBox="0 0 ${G.cols} ${G.rows}" shape-rendering="crispEdges">${dots}${marks}</svg>`;
}

function viewMap() {
  const { got, total } = counts();
  const pins = DEX.map(e => {
    const st = effStatus(e);
    return `<button class="card row" onclick="go('#/entry/${e.id}')">
      <span class="chip chip-${st}">${STATUS_GLYPH[st]}</span>
      <span class="rmain">
        <span class="rname">${esc(e.name)}</span>
        <span class="rsub">${esc(e.region)}</span>
      </span>
    </button>`;
  }).join('');
  const usPins = typeof MAP_GRID_US !== 'undefined'
    && DEX.some(e => e.coords.lon >= MAP_GRID_US.lonMin && e.coords.lon <= MAP_GRID_US.lonMax
      && e.coords.lat >= MAP_GRID_US.latMin && e.coords.lat <= MAP_GRID_US.latMax);
  return `
    <div class="card mapcard">
      <div class="maphead"><span class="h-label">World grid</span><span class="cnt">${got} of ${total}</span></div>
      ${mapSVG(MAP_GRID, 1.7)}
      <div class="legend">
        <span><span class="g-visited">◆</span>Collected</span>
        <span><span class="g-upcoming">◈</span>En route</span>
        <span><span class="g-wishlist">◇</span>Uncharted</span>
      </div>
    </div>
    ${usPins ? `<div class="card mapcard">
      <div class="maphead"><span class="h-label">Region · USA</span></div>
      ${mapSVG(MAP_GRID_US, 1.5)}
    </div>` : ''}
    ${pins}`;
}

function viewInfo() {
  return `
    <div class="card infocard">
      <span class="h-label">About this unit</span>
      <div class="prose">
        <p><b>Terradex</b> is a field guide to places — visited, en route, and uncharted. Every entry logs the facts, the human history, and the deep time underneath: what stood on that ground when dinosaurs walked, and long before.</p>
        <p>New entries are forged in code. Bring a destination to Claude, and a researched page ships to the dex as a commit.</p>
        <p>Mark a place <b style="color:var(--red)">◆ collected</b> when you have stood on its ground. Collections live on this device.</p>
      </div>
    </div>
    <div class="card infocard">
      <span class="h-label">Spec</span>
      <div class="kv">
        <div><span class="k">Firmware</span><span>v5</span></div>
        <div><span class="k">Display</span><span>Simulated e-ink · 5 colors</span></div>
        <div><span class="k">Storage</span><span>On-device (localStorage)</span></div>
        <div><span class="k">Network</span><span>Works offline</span></div>
        <div><span class="k">Future HW</span><span>Pocket e-ink panel</span></div>
      </div>
    </div>
    <div class="card infocard">
      <span class="h-label">Install</span>
      <div class="prose">
        <p style="margin:0">On iPhone: open in Safari → Share → <b>Add to Home Screen</b>. It runs full-screen and offline, like a device of its own.</p>
      </div>
    </div>`;
}

/* ---------- router ---------- */
const state = { tab: 'facts' };

function route() {
  const h = location.hash || '#/dex';
  if (h.startsWith('#/entry/')) return { view: 'entry', id: h.slice(8) };
  if (h === '#/map') return { view: 'map' };
  if (h === '#/info') return { view: 'info' };
  return { view: 'dex' };
}

function render() {
  const r = route();
  const el = document.getElementById('view');
  if (r.view === 'entry') el.innerHTML = viewEntry(r.id);
  else if (r.view === 'map') el.innerHTML = viewMap();
  else if (r.view === 'info') el.innerHTML = viewInfo();
  else el.innerHTML = viewDex();

  for (const n of ['dex', 'map', 'info']) {
    document.getElementById('nav-' + n).classList.toggle('on', r.view === n || (n === 'dex' && r.view === 'entry'));
  }
  const { got, total } = counts();
  document.getElementById('tally').innerHTML = `<b>${got}</b> of ${total} collected`;
}

/* e-ink page flip: hard black flash, then the new page is simply there */
let flashTimer = null;
function flip(fn) {
  const f = document.getElementById('flash');
  f.classList.add('on');
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => {
    fn();
    window.scrollTo(0, 0);
    setTimeout(() => f.classList.remove('on'), 60);
  }, 90);
}

function go(hash) {
  if (location.hash === hash) return;
  state.tab = 'facts';
  location.hash = hash; // hashchange listener does the flip+render
}
function setTab(t) {
  state.tab = t;
  render(); // tab change is a partial refresh — no full flash, like e-ink partial update
}

function mark(id) {
  const s = store.load();
  s.collected[id] = new Date().toISOString().slice(0, 10);
  store.save(s);
  flip(render);
}
function unmark(id) {
  const s = store.load();
  delete s.collected[id];
  store.save(s);
  flip(render);
}

window.addEventListener('hashchange', () => flip(render));
render();

/* ---------- PWA ---------- */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
