<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F2F2EF">
<title>Terradex</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Terradex">
<style>
  /* ---------------------------------------------------------
     POSTER — every place is a gig poster. Giant outlined
     numerals bleeding off the edge, 900-weight names slammed
     over them, one circular status sticker, thick ink rules,
     square corners. Reading content stays quiet underneath.
     Five colors. No gradients, no eased motion. Pages flip.
     --------------------------------------------------------- */
  :root {
    --paper: #F2F2EF;
    --ink: #17171A;
    --gray: #9A9A97;
    --faint: #DCDCD7;
    --stroke: #C7C7C2;
    --red: #DB3B26;
    --green: #2C7C46;
    --sans: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; transition: none !important; animation: none; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: auto; }
  body {
    font-family: var(--sans);
    background: var(--paper);
    background-image: radial-gradient(rgba(23, 23, 26, 0.04) 1px, transparent 1px);
    background-size: 3px 3px;
    color: var(--ink);
    font-size: 15px;
    line-height: 1.55;
    letter-spacing: -0.005em;
    margin: 0;
    min-height: 100vh;
  }
  ::selection { background: var(--ink); color: var(--paper); }

  button {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    text-align: left;
  }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--red); outline-offset: -3px; }
  a { color: inherit; }
  .hidden { display: none !important; }
  .mono { font-family: var(--mono); }

  .bignum {
    position: absolute;
    right: -8px;
    top: -16px;
    font-size: 96px;
    font-weight: 900;
    letter-spacing: -0.05em;
    line-height: 1;
    color: transparent;
    -webkit-text-stroke: 1.5px var(--stroke);
    pointer-events: none;
    font-variant-numeric: tabular-nums;
  }

  .stick {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    transform: rotate(8deg);
    flex: none;
  }
  .stick.s-visited { background: var(--red); color: var(--paper); }
  .stick.s-upcoming { background: var(--green); color: var(--paper); }
  .stick.s-wishlist { background: none; color: var(--gray); border: 2px dashed var(--gray); }

  .g-visited { color: var(--red); }
  .g-upcoming { color: var(--green); }
  .g-wishlist { color: var(--gray); }

  /* ---------- chrome ---------- */
  #topbar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--paper);
    border-bottom: 2px solid var(--ink);
    padding: calc(10px + env(safe-area-inset-top)) 16px 9px;
  }
  #topbar .in {
    max-width: 430px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  #topbar .mark { font-size: 16px; font-weight: 900; letter-spacing: 0.06em; }
  #topbar .mark .dia { color: var(--red); font-size: 13px; }
  #topbar .tally { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: var(--gray); }
  #topbar .tally b { color: var(--ink); }

  #nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 5;
    background: var(--paper);
    border-top: 2px solid var(--ink);
    padding: 0 0 env(safe-area-inset-bottom);
  }
  #nav .in { max-width: 430px; margin: 0 auto; display: flex; }
  #nav button {
    flex: 1;
    text-align: center;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gray);
    padding: 14px 0 13px;
  }
  #nav button + button { border-left: 2px solid var(--ink); }
  #nav button.on { background: var(--ink); color: var(--paper); }

  .wrap {
    max-width: 430px;
    margin: 0 auto;
    padding: 0 0 calc(78px + env(safe-area-inset-bottom));
  }
  main { display: flex; flex-direction: column; }

  /* ---------- masthead (dex) ---------- */
  .masthead {
    position: relative;
    overflow: hidden;
    padding: 22px 16px 16px;
    border-bottom: 2px solid var(--ink);
  }
  .masthead .mh-big {
    font-size: 78px;
    font-weight: 900;
    letter-spacing: -0.05em;
    line-height: 0.95;
    color: var(--red);
    font-variant-numeric: tabular-nums;
  }
  .masthead .mh-big i {
    font-style: normal;
    color: transparent;
    -webkit-text-stroke: 2px var(--ink);
  }
  .masthead .mh-label {
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin: 2px 0 10px;
  }
  .masthead .dots { font-size: 15px; letter-spacing: 0.3em; }
  .dots .d-visited { color: var(--red); }
  .dots .d-upcoming { color: var(--green); }
  .dots .d-wishlist, .dots .d-unknown { color: var(--gray); }

  /* ---------- poster rows ---------- */
  .prow {
    position: relative;
    overflow: hidden;
    display: block;
    width: 100%;
    padding: 20px 16px 14px;
    border-bottom: 2px solid var(--ink);
  }
  .prow:active { background: var(--ink); color: var(--paper); }
  .prow:active .bignum { -webkit-text-stroke-color: #4B4B47; }
  .prow:active .rg { color: var(--paper); }
  .prow .nm {
    position: relative;
    font-size: 30px;
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 0.95;
    text-transform: uppercase;
    max-width: 76%;
  }
  .prow .rg {
    position: relative;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gray);
    margin-top: 6px;
  }
  .prow .stick { position: absolute; right: 14px; bottom: 14px; }
  .prow.unknown .nm { color: var(--gray); }
  .prow.unknown:active { background: none; color: inherit; }

  .prow.sm { padding: 14px 16px 12px; }
  .prow.sm .bignum { font-size: 60px; top: -10px; }
  .prow.sm .nm { font-size: 21px; }
  .prow.sm .stick { width: 34px; height: 34px; font-size: 13px; bottom: 12px; }

  /* ---------- entry ---------- */
  .crumb {
    display: block;
    width: 100%;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gray);
    padding: 12px 16px;
    border-bottom: 1px solid var(--faint);
  }
  .crumb:active { color: var(--ink); }

  .phero {
    position: relative;
    overflow: hidden;
    padding: 26px 16px 18px;
  }
  .phero .bignum { font-size: 150px; top: -26px; right: -12px; -webkit-text-stroke-width: 2px; }
  .phero h1 {
    position: relative;
    margin: 0;
    font-size: 44px;
    font-weight: 900;
    letter-spacing: -0.035em;
    line-height: 0.95;
    text-transform: uppercase;
    max-width: 88%;
  }
  .phero .rg {
    position: relative;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gray);
    margin-top: 8px;
  }
  .phero .stickline { position: relative; display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .phero .stick { width: 40px; height: 40px; font-size: 15px; }
  .phero .stlabel { font-size: 11px; font-weight: 900; letter-spacing: 0.18em; text-transform: uppercase; }

  .plate { margin: 0; border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink); }
  .plate svg { display: block; width: 100%; height: auto; }
  .plate figcaption {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.12em;
    color: var(--gray);
    text-transform: uppercase;
    padding: 8px 16px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    border-top: 1px solid var(--faint);
  }

  .flavor {
    margin: 0;
    padding: 22px 26px;
    font-size: 17px;
    font-weight: 600;
    font-style: italic;
    line-height: 1.55;
    text-align: center;
  }
  .flavor::before {
    content: '◆';
    display: block;
    font-style: normal;
    font-size: 11px;
    color: var(--red);
    margin-bottom: 8px;
  }

  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-top: 2px solid var(--ink);
    border-bottom: 2px solid var(--ink);
  }
  .stats > div { padding: 10px 16px 9px; border-top: 2px solid var(--ink); }
  .stats > div:nth-child(-n+2) { border-top: none; }
  .stats > div:nth-child(odd) { border-right: 2px solid var(--ink); }
  .stats .k {
    font-family: var(--mono);
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gray);
  }
  .stats .v { font-size: 18px; font-weight: 900; letter-spacing: -0.02em; margin-top: 1px; }

  .tabs { display: flex; gap: 22px; padding: 18px 16px 0; }
  .tabs button {
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--gray);
    padding-bottom: 6px;
    border-bottom: 4px solid transparent;
  }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--ink); }

  .tabbody { padding: 4px 16px 8px; }
  .facts { margin: 0; padding: 0; list-style: none; }
  .facts li { padding: 13px 0; display: flex; gap: 12px; font-size: 14.5px; line-height: 1.6; }
  .facts li + li { border-top: 1px solid var(--faint); }
  .facts .bullet { color: var(--red); flex: none; font-size: 10px; padding-top: 4px; }

  .tl-item { padding: 14px 0; }
  .tl-item + .tl-item { border-top: 1px solid var(--faint); }
  .tl-item .era {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gray);
  }
  .tl-item.deep .era { color: var(--green); }
  .tl-item .t { font-weight: 800; font-size: 16px; letter-spacing: -0.015em; margin: 3px 0 3px; }
  .tl-item .x { font-size: 14.5px; line-height: 1.6; }

  .collectwrap { margin-top: 12px; }
  .collectbtn {
    display: block;
    width: 100%;
    text-align: center;
    background: var(--red);
    color: var(--paper);
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 18px 0;
    border-top: 2px solid var(--ink);
  }
  .collectbtn:active { background: var(--ink); }

  .collected-wrap { text-align: center; padding: 10px 0 26px; border-top: 2px solid var(--ink); }
  .bigstick {
    width: 132px;
    height: 132px;
    border-radius: 50%;
    background: var(--red);
    color: var(--paper);
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    transform: rotate(-9deg);
    margin-top: 16px;
    position: relative;
  }
  .bigstick::after {
    content: '';
    position: absolute;
    inset: 7px;
    border: 2px dashed var(--paper);
    border-radius: 50%;
  }
  .bigstick .g { font-size: 20px; line-height: 1; }
  .bigstick .w { font-size: 12px; font-weight: 900; letter-spacing: 0.16em; }
  .bigstick .d { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.08em; }
  .unmark {
    display: block;
    margin: 14px auto 0;
    text-align: center;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gray);
  }

  /* ---------- map ---------- */
  .secthead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 20px 16px 10px;
  }
  .secthead h2 {
    margin: 0;
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
    text-transform: uppercase;
  }
  .secthead .cnt { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--gray); letter-spacing: 0.08em; }
  .mapblock { border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink); }
  .mapblock svg { display: block; width: 100%; height: auto; }
  .legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 12px 0 4px;
    font-size: 9.5px;
    font-weight: 900;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gray);
  }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .pinlist { margin-top: 14px; border-top: 2px solid var(--ink); }

  /* ---------- info ---------- */
  .prose { font-size: 14.5px; line-height: 1.7; padding: 6px 16px 14px; }
  .prose p { margin: 10px 0 0; }
  .kv { padding: 0 16px 10px; }
  .kv div {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 10px 0;
    border-bottom: 1px solid var(--faint);
    font-size: 14px;
    font-weight: 700;
  }
  .kv div:last-child { border-bottom: none; }
  .kv .k {
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gray);
  }

  /* ---------- e-ink refresh flash ---------- */
  #flash {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: var(--ink);
    pointer-events: none;
    display: none;
  }
  #flash.on { display: block; }
</style>
</head>
<body>

<div id="topbar">
  <div class="in">
    <span class="mark"><span class="dia">◆</span> TERRADEX</span>
    <span class="tally" id="tally"></span>
  </div>
</div>

<div class="wrap"><main id="view"></main></div>

<div id="nav">
  <div class="in">
    <button id="nav-dex" onclick="go('#/dex')">Dex</button>
    <button id="nav-map" onclick="go('#/map')">Map</button>
    <button id="nav-info" onclick="go('#/info')">Info</button>
  </div>
</div>

<div id="flash"></div>

<script src="data.js"></script>
<script src="map-data.js"></script>
<script>
/* ============================================================
   TERRADEX — a Pokédex for places, as a poster wall.
   ============================================================ */
const KEY = 'terradex-v1';
const store = {
  load() { try { return JSON.parse(localStorage.getItem(KEY)) || { collected: {} }; } catch { return { collected: {} }; } },
  save(s) { localStorage.setItem(KEY, JSON.stringify(s)); },
};

const pad3 = n => String(n).padStart(3, '0');
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

const STATUS_LABEL = { visited: 'Collected', upcoming: 'En route', wishlist: 'Uncharted' };
const STATUS_GLYPH = { visited: '◆', upcoming: '◈', wishlist: '◇' };

function effStatus(e) {
  const s = store.load();
  if (s.collected[e.id]) return 'visited';
  return e.status;
}
function collectedDate(e) {
  const s = store.load();
  return s.collected[e.id] || (e.status === 'visited' ? e.visitedDate || '' : '');
}
function counts() {
  const total = DEX.length;
  const got = DEX.filter(e => effStatus(e) === 'visited').length;
  return { got, total };
}

/* ---------- field plates (engraved-style SVG illustrations) ---------- */
const ART_DEFS = `<defs>
  <pattern id="hg" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="var(--gray)" stroke-width="1"/></pattern>
  <pattern id="hi" width="3.5" height="3.5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="3.5" stroke="var(--ink)" stroke-width="1"/></pattern>
  <pattern id="hx" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 0L6 6M6 0L0 6" stroke="var(--gray)" stroke-width="0.7" fill="none"/></pattern>
  <pattern id="dt" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1.4" cy="1.4" r="0.9" fill="var(--gray)"/><circle cx="4.4" cy="4.4" r="0.9" fill="var(--gray)"/></pattern>
  <pattern id="wl" width="9" height="5" patternUnits="userSpaceOnUse"><line x1="0" y1="1.5" x2="6" y2="1.5" stroke="var(--gray)" stroke-width="1"/></pattern>
  <pattern id="wg" width="9" height="5" patternUnits="userSpaceOnUse"><line x1="0" y1="1.5" x2="6" y2="1.5" stroke="var(--green)" stroke-width="1.1"/></pattern>
  <pattern id="wv" width="5" height="9" patternUnits="userSpaceOnUse"><line x1="1.5" y1="0" x2="1.5" y2="7" stroke="var(--gray)" stroke-width="1"/></pattern>
</defs>`;
function artSVG(art) {
  return `<svg viewBox="0 0 400 170" role="img">${ART_DEFS}${art}</svg>`;
}

/* ---------- views ---------- */
function viewDex() {
  const { got, total } = counts();
  const unknownSlots = typeof DEX_UNKNOWN_SLOTS === 'number' ? DEX_UNKNOWN_SLOTS : 0;
  const dots = DEX.map(e => `<span class="d-${effStatus(e)}">${STATUS_GLYPH[effStatus(e)]}</span>`).join('')
    + `<span class="d-unknown">${'·'.repeat(unknownSlots)}</span>`;

  const rows = DEX.map(e => {
    const st = effStatus(e);
    return `<button class="prow" onclick="go('#/entry/${e.id}')">
      <span class="bignum">${pad3(e.num)}</span>
      <div class="nm">${esc(e.name)}</div>
      <div class="rg">${esc(e.region)} · ${STATUS_LABEL[st]}</div>
      <span class="stick s-${st}">${STATUS_GLYPH[st]}</span>
    </button>`;
  }).join('');

  let unknown = '';
  const nextNum = (DEX[DEX.length - 1]?.num || 0) + 1;
  for (let i = 0; i < unknownSlots; i++) {
    unknown += `<div class="prow unknown">
      <span class="bignum">${pad3(nextNum + i)}</span>
      <div class="nm">???</div>
      <div class="rg">Not yet logged</div>
      <span class="stick s-wishlist">?</span>
    </div>`;
  }

  return `
    <div class="masthead">
      <span class="bignum">DEX</span>
      <div class="mh-big">${got}<i>/${total}</i></div>
      <div class="mh-label">Places collected</div>
      <div class="dots">${dots}</div>
    </div>
    ${rows}${unknown}`;
}

function viewEntry(id) {
  const e = DEX.find(x => x.id === id);
  if (!e) return `<div class="prose">Entry not found.</div>`;
  const st = effStatus(e);
  const date = collectedDate(e);
  const tab = state.tab;

  const statsHTML = Object.entries(e.stats).map(([k, v]) =>
    `<div><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('');

  let body = '';
  if (tab === 'facts') {
    body = `<ul class="facts">${e.facts.map(f => `<li><span class="bullet">◆</span><span>${esc(f)}</span></li>`).join('')}</ul>`;
  } else {
    const items = tab === 'history' ? e.history : e.deepTime;
    const cls = tab === 'deep' ? 'tl-item deep' : 'tl-item';
    body = items.map(i =>
      `<div class="${cls}"><span class="era">${esc(i.era)}</span><div class="t">${esc(i.title)}</div><div class="x">${esc(i.text)}</div></div>`).join('');
  }

  const lat = e.coords.lat, lon = e.coords.lon;
  const coordStr = `${Math.abs(lat).toFixed(2)}°${lat >= 0 ? 'N' : 'S'} ${Math.abs(lon).toFixed(2)}°${lon >= 0 ? 'E' : 'W'}`;

  const userCollected = !!store.load().collected[e.id];
  const collectUI = st === 'visited'
    ? `<div class="collected-wrap">
         <div class="bigstick"><span class="g">◆</span><span class="w">COLLECTED</span>${date ? `<span class="d">${esc(date)}</span>` : ''}</div>
         ${userCollected ? `<button class="unmark" onclick="unmark('${e.id}')">Unmark</button>` : ''}
       </div>`
    : `<button class="collectbtn" onclick="mark('${e.id}')">◆ Mark collected</button>`;

  return `
    <button class="crumb" onclick="go('#/dex')">← Dex</button>
    <header class="phero">
      <span class="bignum">${pad3(e.num)}</span>
      <h1>${esc(e.name)}</h1>
      <div class="rg">${esc(e.region)} · ${e.types.map(esc).join(' / ')}</div>
      <div class="stickline">
        <span class="stick s-${st}">${STATUS_GLYPH[st]}</span>
        <span class="stlabel g-${st}">${STATUS_LABEL[st]}</span>
      </div>
    </header>
    <figure class="plate">
      ${artSVG(e.art)}
      <figcaption><span>Field plate Nº ${pad3(e.num)}</span><span>${coordStr}</span></figcaption>
    </figure>
    <p class="flavor">${esc(e.flavor)}</p>
    <section class="stats">${statsHTML}</section>
    <nav class="tabs">
      <button class="${tab === 'facts' ? 'on' : ''}" onclick="setTab('facts')">Facts</button>
      <button class="${tab === 'history' ? 'on' : ''}" onclick="setTab('history')">History</button>
      <button class="${tab === 'deep' ? 'on' : ''}" onclick="setTab('deep')">Deep time</button>
    </nav>
    <div class="tabbody">${body}</div>
    <div class="collectwrap">${collectUI}</div>`;
}

function mapSVG(G, size) {
  let dots = '';
  for (let r = 0; r < G.rows; r++) {
    const row = G.land[r];
    for (let c = 0; c < G.cols; c++) {
      if (row[c] === '#') dots += `<rect x="${c + 0.18}" y="${r + 0.18}" width="0.64" height="0.64" fill="var(--gray)"/>`;
    }
  }
  const inBounds = e => e.coords.lon >= G.lonMin && e.coords.lon <= G.lonMax
    && e.coords.lat >= G.latMin && e.coords.lat <= G.latMax;
  const toXY = (lat, lon) => [
    (lon - G.lonMin) / (G.lonMax - G.lonMin) * G.cols,
    (G.latMax - lat) / (G.latMax - G.latMin) * G.rows,
  ];
  let marks = '';
  for (const e of DEX.filter(inBounds)) {
    const st = effStatus(e);
    const [x, y] = toXY(e.coords.lat, e.coords.lon);
    const d = `M ${x} ${y - size} L ${x + size} ${y} L ${x} ${y + size} L ${x - size} ${y} Z`;
    const color = st === 'wishlist' ? 'var(--ink)' : st === 'upcoming' ? 'var(--green)' : 'var(--red)';
    const fill = st === 'visited' ? color : 'var(--paper)';
    marks += `<g onclick="go('#/entry/${e.id}')" style="cursor:pointer">
      <rect x="${x - 3}" y="${y - 3}" width="6" height="6" fill="transparent"/>
      <path d="${d}" fill="${fill}" stroke="${color}" stroke-width="0.55"/>
    </g>`;
  }
  return `<svg viewBox="0 0 ${G.cols} ${G.rows}" shape-rendering="crispEdges">${dots}${marks}</svg>`;
}

function viewMap() {
  const { got, total } = counts();
  const pins = DEX.map(e => {
    const st = effStatus(e);
    return `<button class="prow sm" onclick="go('#/entry/${e.id}')">
      <span class="bignum">${pad3(e.num)}</span>
      <div class="nm">${esc(e.name)}</div>
      <div class="rg">${esc(e.region)}</div>
      <span class="stick s-${st}">${STATUS_GLYPH[st]}</span>
    </button>`;
  }).join('');
  const usPins = typeof MAP_GRID_US !== 'undefined'
    && DEX.some(e => e.coords.lon >= MAP_GRID_US.lonMin && e.coords.lon <= MAP_GRID_US.lonMax
      && e.coords.lat >= MAP_GRID_US.latMin && e.coords.lat <= MAP_GRID_US.latMax);
  return `
    <div class="secthead"><h2>World grid</h2><span class="cnt">${pad3(got)}/${pad3(total)}</span></div>
    <div class="mapblock">${mapSVG(MAP_GRID, 1.7)}</div>
    <div class="legend">
      <span><span class="g-visited">◆</span>Collected</span>
      <span><span class="g-upcoming">◈</span>En route</span>
      <span><span class="g-wishlist">◇</span>Uncharted</span>
    </div>
    ${usPins ? `<div class="secthead"><h2>Region · USA</h2></div>
    <div class="mapblock">${mapSVG(MAP_GRID_US, 1.5)}</div>` : ''}
    <div class="pinlist">${pins}</div>`;
}

function viewInfo() {
  return `
    <div class="secthead"><h2>About this unit</h2></div>
    <div class="prose" style="padding-top:0">
      <p style="margin-top:0"><b>Terradex</b> is a field guide to places — visited, en route, and uncharted. Every entry logs the facts, the human history, and the deep time underneath: what stood on that ground when dinosaurs walked, and long before.</p>
      <p>New entries are forged in code. Bring a destination to Claude, and a researched page ships to the dex as a commit.</p>
      <p>Mark a place <b style="color:var(--red)">◆ collected</b> when you have stood on its ground. Collections live on this device.</p>
    </div>
    <div class="secthead"><h2>Spec</h2></div>
    <div class="kv">
      <div><span class="k">Firmware</span><span>v6 · POSTER</span></div>
      <div><span class="k">Display</span><span>Simulated e-ink · 5 colors</span></div>
      <div><span class="k">Storage</span><span>On-device (localStorage)</span></div>
      <div><span class="k">Network</span><span>Works offline</span></div>
      <div><span class="k">Future HW</span><span>Pocket e-ink panel</span></div>
    </div>
    <div class="secthead"><h2>Install</h2></div>
    <div class="prose" style="padding-top:0">
      <p style="margin:0">On iPhone: open in Safari → Share → <b>Add to Home Screen</b>. It runs full-screen and offline, like a device of its own.</p>
    </div>`;
}

/* ---------- router ---------- */
const state = { tab: 'facts' };

function route() {
  const h = location.hash || '#/dex';
  if (h.startsWith('#/entry/')) return { view: 'entry', id: h.slice(8) };
  if (h === '#/map') return { view: 'map' };
  if (h === '#/info') return { view: 'info' };
  return { view: 'dex' };
}

function render() {
  const r = route();
  const el = document.getElementById('view');
  if (r.view === 'entry') el.innerHTML = viewEntry(r.id);
  else if (r.view === 'map') el.innerHTML = viewMap();
  else if (r.view === 'info') el.innerHTML = viewInfo();
  else el.innerHTML = viewDex();

  for (const n of ['dex', 'map', 'info']) {
    document.getElementById('nav-' + n).classList.toggle('on', r.view === n || (n === 'dex' && r.view === 'entry'));
  }
  const { got, total } = counts();
  document.getElementById('tally').innerHTML = `<b>${pad3(got)}</b>/${pad3(total)}`;
}

/* e-ink page flip: hard black flash, then the new page is simply there */
let flashTimer = null;
function flip(fn) {
  const f = document.getElementById('flash');
  f.classList.add('on');
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => {
    fn();
    window.scrollTo(0, 0);
    setTimeout(() => f.classList.remove('on'), 60);
  }, 90);
}

function go(hash) {
  if (location.hash === hash) return;
  state.tab = 'facts';
  location.hash = hash; // hashchange listener does the flip+render
}
function setTab(t) {
  state.tab = t;
  render(); // tab change is a partial refresh — no full flash, like e-ink partial update
}

function mark(id) {
  const s = store.load();
  s.collected[id] = new Date().toISOString().slice(0, 10);
  store.save(s);
  flip(render);
}
function unmark(id) {
  const s = store.load();
  delete s.collected[id];
  store.save(s);
  flip(render);
}

window.addEventListener('hashchange', () => flip(render));
render();

/* ---------- PWA ---------- */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
