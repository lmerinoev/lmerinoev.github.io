<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Boo Lab</title>
<style>
  body { margin: 0; background: #17142e; color: #cfc9f2; font: 14px/1.4 sans-serif; padding: 16px; }
  h1 { font-size: 16px; margin: 0 0 10px; }
  .sheet { display: grid; grid-template-columns: repeat(4, 190px); gap: 8px; }
  .cell { position: relative; }
  .cell canvas { width: 190px; height: 190px; background: #201c40; border-radius: 10px; display: block; }
  .cell span { position: absolute; top: 6px; left: 8px; font-size: 11px; opacity: 0.7; }
  #live { width: 300px; height: 300px; background: #201c40; border-radius: 10px; margin-top: 12px; }
  #names { max-width: 800px; }
  a { color: #6ee7c8; }
</style>
</head>
<body>
<h1 id="title">Boo Lab</h1>
<div class="sheet" id="sheet"></div>
<canvas id="live"></canvas>
<p id="names"></p>
<script type="module">
import { GhostScene } from './ghost.js';
import { ANIMS } from './anims.js';

const q = new URLSearchParams(location.search);
const name = q.get('anim') || 'idle';
const anim = ANIMS[name];
document.getElementById('title').textContent = name + (anim ? ` — ${anim.dur}s, ${anim.keys.length} keys` : ' — NOT FOUND');
document.getElementById('names').innerHTML =
  'available: ' + Object.keys(ANIMS).map(n => `<a href="?anim=${n}">${n}</a>`).join(' · ');

if (anim) {
  const N = 8;
  const sheet = document.getElementById('sheet');
  for (let i = 0; i < N; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const cv = document.createElement('canvas');
    const tag = document.createElement('span');
    tag.textContent = 't=' + (i / N).toFixed(2);
    cell.append(cv, tag);
    sheet.append(cell);
    const gs = new GhostScene(cv);
    gs.setAnim(anim);
    gs.setPhase(i / N);
  }
  const live = new GhostScene(document.getElementById('live'));
  live.setAnim(anim);
  live.start();
}
window.__labReady = true;
</script>
</body>
</html>
